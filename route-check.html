<!doctype html><html lang="en"><meta charset="utf-8"><title>Not Right Meow — Skyline crossing</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#10151d;color:#e4ddd0;font:14px Arial}h1{font-size:24px;letter-spacing:2px;margin:0 0 8px}p{color:#a5b6c1;margin:0 0 18px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1300px}section{border:1px solid #465666;background:#1b2635;border-radius:5px;overflow:hidden}h2{font:12px monospace;letter-spacing:1px;margin:12px 14px;color:#e4ba7e}canvas{width:100%;aspect-ratio:16/9;display:block}#result{margin-top:16px;color:#9cc7b3}</style><h1>NOT RIGHT MEOW / SHORT LANDINGS</h1><p>Short roofs. Small crane decks. Narrow steel. Keep the jumps coming.</p><main id="scenes"></main><p id="result">Rendering the playable route…</p><script src="./assets/seasonal.js"></script><script src="./assets/art.js"></script><script src="./src/core.js"></script><script src="./src/renderer.js"></script><script>
const shots=[[1,'01 / SHORT ROOFTOP'],[2,'02 / CARGO CAP'],[5,'03 / SMALL CRANE DECK'],[6,'04 / PRECISION BEAMS']];
for(const [score,label]of shots){const section=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas');h.textContent=label;section.append(h,canvas);document.getElementById('scenes').append(section);const g=new NRM.Game(NRM.rng(17));g.start();for(let i=0;i<20000;i++){const p=g.platforms.find(p=>p.h===g.y&&p.x<318&&p.x+p.w>282);if(g.grounded&&p&&p.x+p.w-300<=(p.kind==='crate_stack'?18:26))g.jump();g.update(NRM.C.step);g.drainEvents();if(g.phase!=='playing')throw Error('Route failed');if(g.score>=score&&g.grounded&&(score!==0||g.distance>410))break;}const r=new Renderer(canvas);r.camera=g.surfaceY-100;r.time=g.elapsed;r.draw(g,0);}
document.getElementById('result').textContent='Playable route • Frames from the shipped game engine, advanced with scripted jump inputs.';
</script></html>
