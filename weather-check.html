<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Not Right Meow — weather preview</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#10151d;color:#dce4e7;font:14px Arial}h1{font-size:20px;letter-spacing:2px;margin:0 0 8px}p{color:#a2b6c0}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1250px}section{background:#182331;border:1px solid #435969;border-radius:6px;overflow:hidden}h2{font-size:12px;letter-spacing:2px;margin:12px 16px;color:#e3b185}canvas{display:block;width:100%;aspect-ratio:16/9}#result{color:#96cbbb}</style><h1>NOT RIGHT MEOW / CHANGING WEATHER</h1><p>Actual game renderer · atmospheric previews · identical jump physics in every condition</p><p id="result">Rendering…</p><main id="scenes"></main><script src="./assets/seasonal.js"></script><script src="./assets/art.js"></script><script src="./src/core.js"></script><script src="./src/renderer.js"></script><script>
const scenes=document.getElementById('scenes'),renderers=[];
for(const [label,time] of [['CLEAR DUSK',0],['RAIN',16],['FOG',32],['STORM',46]]){
 const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas');heading.textContent=label;section.append(heading,canvas);scenes.append(section);const game=new NRM.Game(NRM.rng(2));game.start();const renderer=new Renderer(canvas);renderer.time=time;renderer.draw(game,0);if(renderer.weather.label!==label)throw Error('Wrong weather label');renderers.push({renderer,game});
}
const freeze=renderers[1];freeze.game.pause();const before=freeze.renderer.time;freeze.renderer.draw(freeze.game,.5);if(before!==freeze.renderer.time)throw Error('Paused weather advanced');freeze.game.start();freeze.renderer.draw(freeze.game,0);if(freeze.renderer.weather.label!=='RAIN')throw Error('Restart reset weather');document.getElementById('result').textContent='PASS — four conditions render; pause freezes weather; restarting preserves the current weather.';
</script></html>
