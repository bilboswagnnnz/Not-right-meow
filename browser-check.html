<!doctype html><html><meta charset="utf-8"><title>Rooftop route gameplay QA</title><style>body{font:15px monospace;background:#111b27;color:#d3dde2}button{padding:14px}iframe{display:block;width:1000px;height:700px;border:1px solid;margin-top:15px}li{margin:7px}img{width:1000px;max-width:100%}</style><h1>Rooftops → crane → suspended beams</h1><button id="run">Run browser checks</button><p id="result">Ready</p><ol id="checks"></ol><img id="capture" alt="Live gameplay capture during the crane and suspended beam crossing"><iframe id="play" src="./index.html?qa=1"></iframe><script>
const f=document.getElementById('play'),out=document.getElementById('checks'),result=document.getElementById('result');
const wait=ms=>new Promise(r=>setTimeout(r,ms)),state=()=>f.contentWindow.NotRightMeow.snapshot(),key=(code,repeat=false)=>f.contentDocument.dispatchEvent(new KeyboardEvent('keydown',{code,bubbles:true,repeat}));
const check=(value,label)=>{const li=document.createElement('li');li.textContent=(value?'PASS: ':'FAIL: ')+label;out.append(li);if(!value)throw Error(label);};
const until=async(fn,ms=45000)=>{const end=performance.now()+ms;while(!fn()){if(performance.now()>end)throw Error('Timed out');await wait(10);}};
document.getElementById('run').onclick=async()=>{out.innerHTML='';result.textContent='Running';try{
 f.contentDocument.getElementById('start').click();if(!state().audio.music)f.contentDocument.getElementById('music').click();check(state().phase==='playing'&&state().y===180,'Start on the roof, above the street');
 key('Space');await until(()=>state().y>180);check(!state().grounded,'Space launches a roof jump');
 key('KeyP');const freeze=()=>JSON.stringify([state().y,state().score,state().platforms,state().speed]);const before=freeze();await wait(200);check(before===freeze(),'Pause freezes movement and architecture');
 key('Space');check(state().phase==='playing','Space resumes');await until(()=>state().grounded);check(state().y===180,'Automatically land back on the roof');key('Space',true);check(state().grounded,'Held key repeat does not jump');
 const surfaces=new Set(),chapters=new Set();let captured=false,sawLandingRing=false;
 const capture=()=>{const s=state();if(!captured&&s.score>=2&&s.score<4){document.getElementById('capture').src=f.contentDocument.getElementById('game').toDataURL('image/png');captured=true;}if(!captured&&s.phase==='playing')requestAnimationFrame(capture);};requestAnimationFrame(capture);
 const pilot=()=>{const s=state();sawLandingRing=sawLandingRing||s.landingRings>0;chapters.add(s.chapterId);if(s.grounded){const p=s.platforms.find(p=>Math.abs(p.h-s.y)<.01&&p.x<318&&p.x+p.w>282);if(p){surfaces.add(p.kind);if(p.x+p.w-300<=(p.kind==='crate_stack'?18:26))key('Space');}}};f.contentDocument.addEventListener('nrm-before-step',pilot);
 await until(()=>{const s=state();if(s.phase!=='playing')throw Error('Crossing failed at '+s.score);return s.elapsed>=21&&s.grounded;},180000);f.contentDocument.removeEventListener('nrm-before-step',pilot);
 check(surfaces.has('roof'),'Cross multiple building roofs');check(surfaces.has('crate_stack'),'Land on narrow staggered crate caps');check(surfaces.has('crane'),'Land on crane deck');check(surfaces.has('beam'),'Land on crane-suspended beams');check(chapters.size>=2,'Enter a different traversal chapter');check(state().score>=13,'Score distinct successful landings');check(sawLandingRing,'Landing impact rings activate');check(state().pace>=1&&f.contentDocument.getElementById('pace-label').textContent==='MOMENTUM','Pace stage advances during the live run');check(f.contentDocument.getElementById('run-clock').textContent!=='0:00','Visible run timer advances');
 const beat=state().audio.beat;await wait(350);check(state().audio.beat>beat,'Electronic music scheduler runs');key('KeyP');const a=state().audio;f.contentDocument.getElementById('sound').click();f.contentDocument.getElementById('music').click();check(state().audio.sfx!==a.sfx&&state().audio.music!==a.music,'Independent sound and music toggles');check(state().audio.state==='running','Web Audio unlocked');
 f.contentDocument.getElementById('resume').click();await until(()=>state().phase==='gameover');const score=state().score;await wait(150);check(state().score===score,'Missed landing ends run and freezes score');key('Space');check(state().phase==='playing'&&state().score===0,'Space restarts rooftop course');key('KeyP');const best=state().best;f.contentWindow.location.reload();await wait(500);await until(()=>f.contentWindow.NotRightMeow&&state().phase==='title');check(state().best===best&&best>=13,'Skyline personal best survives reload');
 f.style.width='640px';await wait(200);check(f.contentDocument.getElementById('game').width>0&&f.contentDocument.documentElement.scrollWidth<=640,'Desktop resize has no overflow');f.style.width='1000px';result.textContent='ALL 22 BROWSER CHECKS PASSED';
}catch(e){result.textContent='FAILED: '+e.message;}};
</script></html>
