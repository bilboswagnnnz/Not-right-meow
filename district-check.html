<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Not Right Meow — four districts</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#10151d;color:#dce4e7;font:13px Arial}h1{font-size:20px;letter-spacing:2px;margin:0 0 7px}p{color:#a2b6c0;margin:8px 0}main{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1200px}section{background:#182331;border:1px solid #435969;border-radius:6px;overflow:hidden}h2{font-size:12px;letter-spacing:2px;margin:10px 14px;color:#e3b185}canvas{display:block;width:100%;aspect-ratio:16/9}section p{padding:0 14px;font-size:11px}#result{color:#96cbbb}</style><h1>NOT RIGHT MEOW / FOUR DISTRICTS</h1><p>Scenery changes every 8 points · sixteen district hazards · six varied platform courses</p><p id="result">Rendering…</p><main id="scenes"></main><script src="./assets/seasonal.js"></script><script src="./assets/art.js"></script><script src="./src/core.js"></script><script src="./src/renderer.js"></script><script>
const fixtures=[];
for(let biome=0;biome<4;biome++){
 const section=document.createElement('section'),heading=document.createElement('h2'),canvas=document.createElement('canvas'),caption=document.createElement('p');heading.textContent=NRM.BIOMES[biome];caption.textContent=NRM.TYPES.filter(o=>o.biome===biome).map(o=>o.name).join(' · ');section.append(heading,canvas,caption);document.getElementById('scenes').append(section);
 const game=new NRM.Game(NRM.rng(2));game.start();game.biome=biome;game.score=biome*8;game.y=64;game.grounded=true;game.distance=biome*1257;game.obstacles=NRM.TYPES.filter(o=>o.biome===biome).map((o,i)=>({...o,x:540+i*178,variant:.3}));game.platforms=[{x:190,w:260,h:64,biome}];const renderer=new Renderer(canvas);renderer.time=5;renderer.draw(game,0);if(renderer.scene!==biome)throw Error('Wrong district');fixtures.push({game,renderer});
}
const {game,renderer}=fixtures[0];game.biome=1;renderer.draw(game,.4);if(renderer.scene!==1||renderer.sceneBlend>=1)throw Error('Missing transition');game.pause();let before=renderer.sceneBlend;renderer.draw(game,.5);if(before!==renderer.sceneBlend)throw Error('Transition ignored pause');game.resume();renderer.draw(game,2);if(renderer.sceneBlend!==1)throw Error('Transition did not finish');game.biome=0;renderer.scene=0;renderer.fromScene=0;renderer.sceneBlend=1;renderer.draw(game,0);
document.getElementById('result').textContent='PASS — all 16 hazards render; district crossfade completes and freezes while paused. Preview scenes use the actual game renderer.';
</script></html>
