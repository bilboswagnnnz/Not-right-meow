<!doctype html><html lang="en"><meta charset="utf-8"><title>Not Right Meow — Progression</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#10151d;color:#e4ddd0;font:14px Arial}h1{font-size:24px;letter-spacing:2px;margin:0 0 8px}p{color:#a5b6c1;margin:0 0 18px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:1300px}section{border:1px solid #465666;background:#1b2635;border-radius:5px;overflow:hidden}h2{font:12px monospace;letter-spacing:1px;margin:12px 14px;color:#e4ba7e}canvas{width:100%;aspect-ratio:16/9;display:block}#result{margin-top:16px;color:#9cc7b3}button{padding:12px;background:#d7a574;color:#122333;border:0;border-radius:3px;cursor:pointer}#audio-result{display:inline;margin-left:14px}</style><h1>NOT RIGHT MEOW / KEEP THE PACE</h1><p>The approved opening. A longer difficulty ramp. Material-specific landing feedback.</p><main id="scenes"></main><p id="result">Rendering engine-driven progression snapshots…</p><button id="audio-check">Check landing audio</button><p id="audio-result">Ready</p><button id="layout-check">Check desktop layouts</button><p id="layout-result">Ready</p><iframe id="layout-frame" title="Layout QA" src="./index.html" style="position:absolute;left:-5000px;top:0;width:1920px;height:1080px;visibility:hidden;border:0"></iframe><script src="./assets/seasonal.js"></script><script src="./assets/art.js"></script><script src="./src/core.js"></script><script src="./src/renderer.js"></script><script src="./src/audio.js"></script><script src="./tests/pilot.js"></script><script>
for(const target of [8,30,80,180]){const section=document.createElement('section'),h=document.createElement('h2'),canvas=document.createElement('canvas');section.append(h,canvas);document.getElementById('scenes').append(section);const g=new NRM.Game(NRM.rng(17));g.start();let landing;
for(let i=0;i<40000;i++){const p=g.platforms.find(p=>p.h===g.y&&p.x<318&&p.x+p.w>282);NRMTest.pilot(g);g.update(NRM.C.step);for(const e of g.drainEvents())if(e.type==='land')landing=e;if(g.phase!=='playing')throw Error('Route failed at '+g.score);if(g.elapsed>=target&&g.grounded)break;}
h.textContent=NRM.PACE[g.pace]+' / '+Math.floor(g.elapsed/60)+':'+String(Math.floor(g.elapsed%60)).padStart(2,'0')+' / '+(g.speed/470).toFixed(2)+'×';const r=new Renderer(canvas);r.camera=g.surfaceY-100;r.time=g.elapsed;if(landing)r.emit(landing);r.draw(g,.04);const frozen=JSON.stringify(r.rings);g.pause();r.draw(g,.5);if(JSON.stringify(r.rings)!==frozen)throw Error('Paused rings moved');}
document.getElementById('result').textContent='Game-engine snapshots with scripted jump inputs • Four pace stages render; pause freezes impact rings.';
document.getElementById('audio-check').onclick=async()=>{const a=new AudioEngine();const out=document.getElementById('audio-result');try{if(!await a.unlock())throw Error('Audio unavailable');for(const material of ['wood','metal','masonry']){a.effect('land',{material,strength:.8});if(!a.notes.length)throw Error('No voices for '+material);await new Promise(r=>setTimeout(r,300));}a.sfx=false;const n=a.notes.length;a.effect('land',{material:'metal'});if(a.notes.length!==n)throw Error('Mute failed');out.textContent='PASS: three landing sounds schedule; mute works.';clearInterval(a.timer);await a.ctx.close();}catch(e){out.textContent='FAIL: '+e.message;}};

document.getElementById('layout-check').onclick=async()=>{const f=document.getElementById('layout-frame'),out=document.getElementById('layout-result');try{for(const w of [640,1280,1920]){f.style.width=w+'px';await new Promise(r=>setTimeout(r,300));const doc=f.contentDocument,canvas=doc.getElementById('game'),rect=canvas.getBoundingClientRect();if(doc.documentElement.scrollWidth>w||canvas.width===0||Math.abs(rect.width/rect.height-16/9)>.01)throw Error('Bad layout '+w);}out.textContent='PASS: 640, 1280 and 1920 px layouts; canvas keeps 16:9; no overflow.';}catch(e){out.textContent='FAIL: '+e.message;}};
</script></html>
